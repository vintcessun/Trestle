# 凭据模板。复制成 secrets.toml 后填真实值 —— secrets.toml 已被 .gitignore。
#
# 每个字段都支持三种写法：
#   password = "明文"
#   password = "env:TRESTLE_GPU1_PW"     从环境变量读，值不落盘
#   password = "file:C:/path/to/secret"  从文件读（读完不缓存到日志）
#
# 也可以用公钥认证（推荐，见 docs/08 Q6）：
#   key_path = "~/.ssh/id_ed25519"
#   key_passphrase = "env:TRESTLE_KEY_PW"   # 可选

[targets.gpu-1]
password = "env:TRESTLE_GPU1_PW"

[targets.gpu-2]
password = "env:TRESTLE_GPU2_PW"

[targets.gpu-3]
password = "env:TRESTLE_GPU3_PW"

[targets.gpu-4]
password = "env:TRESTLE_GPU4_PW"
