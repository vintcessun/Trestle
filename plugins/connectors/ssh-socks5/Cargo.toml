# 这个插件不属于主 workspace —— 它编到 wasm32-wasip2，和 host 的 target 不同。
[workspace]

[package]
name = "ssh-socks5"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 前置条件状态机。和 ssh-direct 共用同一份——「探不通就把它拉起来」
# 对两个驱动是同一件事，差别只在配置里那条命令。
connector-ready = { path = "../../lib/connector-ready" }

[profile.release]
opt-level = "s"
lto = true
strip = true
