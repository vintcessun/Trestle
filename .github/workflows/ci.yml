name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI 机器慢，增量编译的缓存又跨不了 job，关掉省时间
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # 最便宜的检查放最前面：泄密和格式都不需要编译，几秒就能给出答复。
  hygiene:
    name: 卫生检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # 这个仓库是公开的，而个人基础设施信息已经漏进来过三次。
      - name: 有没有个人信息混进来
        shell: pwsh
        run: ./scripts/check-public.ps1

      - name: 格式
        shell: bash
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  test:
    name: 测试 (${{ matrix.os }})
    needs: hygiene
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # 用 runner 自带的 rustup，不额外拉一个 action。
      #
      # 拉 action 是从 codeload.github.com 下载的，GitHub 一抖就是 429，
      # 而且它挂在 "Set up job" 阶段——失败时你连自己的第一条命令都没跑到。
      # 实际发生过：一次 Actions 故障期间 macOS 与 Windows 同时死在这里。
      # rustup 走 static.rust-lang.org，和 GitHub 的死活无关。
      - name: Rust 工具链
        shell: bash
        run: |
          set -euxo pipefail
          rustup default stable
          rustup component add clippy
          rustup target add wasm32-wasip2
          rustc -V
          cargo -V

      # 缓存用官方的 actions/cache，不用第三方 action。
      #
      # 所有被引用的 action 都是在 "Set up job" 阶段下载的，也就是在任何一个
      # step 跑起来之前 —— 所以 `continue-on-error` 救不了它：那管的是 step 的
      # 执行结果，不是 action 的下载。GitHub 一抖，第三方 action 就 429，整个
      # job 死在 setup 里。实际连着两次就是这么挂的。
      # 官方 action 命中率高得多，而且这个仓库本来也只需要它。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      # 插件是测试的输入，不是产物：host 装不上插件就起不来，测试也就跑不了。
      - name: 编插件到 wasm
        shell: bash
        run: |
          set -euo pipefail
          find plugins -name manifest.toml -not -path '*/templates/*' | while read -r manifest; do
            dir=$(dirname "$manifest")
            name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -1)
            # Python 插件要 componentize-py，CI 上不装——它不参与这里的断言。
            if [ -f "$dir/app.py" ]; then
              echo "skip $name (python plugin, needs componentize-py)"
              continue
            fi
            echo "building $name"
            (cd "$dir" && cargo build --release --target wasm32-wasip2)
            cp "$dir/target/wasm32-wasip2/release/${name//-/_}.wasm" "$dir/$name.wasm"
          done

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # 真调测试全部 #[ignore]，所以这里跑的是不碰网络的那部分。
      - name: 测试
        run: cargo test --workspace

      - name: 远端 agent 协议
        shell: bash
        run: python3 agent-py/test_agent.py
