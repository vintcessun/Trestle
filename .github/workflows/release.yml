name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "打一个测试用的版本名（不会创建 release）"
        required: false
        default: "dev"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar

    steps:
      - uses: actions/checkout@v5

      # 用 runner 自带的 rustup，不额外拉 action —— 拉 action 走
      # codeload.github.com，GitHub 一抖就 429，而且是死在 "Set up job"，
      # 连自己的第一条命令都跑不到。rustup 走 static.rust-lang.org。
      - name: Rust 工具链
        shell: bash
        run: |
          set -euxo pipefail
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup target add wasm32-wasip2
          rustc -V

      # 官方 cache。第三方 action 在 GitHub 抖动时会让 job 死在 "Set up job"，
      # 那是任何 step 都还没跑的阶段，continue-on-error 管不着。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: 编三个二进制
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin trestled --bin trestle --bin trestle-mcp

      # 插件是 wasm，和目标平台无关——但每个 job 都得有一份，
      # 因为发布包必须是自包含的。
      - name: 编插件到 wasm
        shell: bash
        run: |
          set -euo pipefail
          for manifest in $(find plugins -name manifest.toml -not -path '*/templates/*'); do
            dir=$(dirname "$manifest")
            name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -1)
            if [ -f "$dir/app.py" ]; then
              echo "skip $name (python plugin, needs componentize-py)"
              continue
            fi
            (cd "$dir" && cargo build --release --target wasm32-wasip2)
            cp "$dir/target/wasm32-wasip2/release/${name//-/_}.wasm" "$dir/$name.wasm"
          done

      # 发布包的形状必须和 install.ps1 装出来的一样：三个二进制、插件、
      # 样例配置全在一个目录里。trestle-mcp 要在自己旁边找到 trestled，
      # 散着放这条链就断了。
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          out="trestle-${version}-${{ matrix.name }}"
          mkdir -p "$out/plugins"

          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          for bin in trestled trestle trestle-mcp; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "$out/"
          done

          for manifest in $(find plugins -name manifest.toml -not -path '*/templates/*'); do
            dir=$(dirname "$manifest")
            name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' "$manifest" | head -1)
            [ -f "$dir/$name.wasm" ] || continue
            kind=$(basename "$(dirname "$dir")")
            mkdir -p "$out/plugins/$kind/$name"
            cp "$manifest" "$out/plugins/$kind/$name/"
            cp "$dir/$name.wasm" "$out/plugins/$kind/$name/"
          done
          cp -r plugins/templates "$out/plugins/templates"
          # 脚手架写的是 ../../../wit，所以 wit/ 必须跟着一起发，
          # 否则 `trestle plugin new` 生成的插件在发布包里编不了。
          cp -r wit "$out/wit"

          cp config/trestle.example.toml config/secrets.example.toml "$out/"
          cp README.md README_zh.md "$out/"
          mkdir -p "$out/skills"
          cp -r .claude/skills/trestle "$out/skills/trestle"
          cp scripts/install.ps1 "$out/" 2>/dev/null || true

          cat > "$out/GETTING-STARTED.txt" <<'EOF'
          Trestle — 装好之后怎么用 / getting started

          1. 复制样例配置，填上你自己的机器与凭据：
                 cp trestle.example.toml trestle.toml
                 cp secrets.example.toml secrets.toml

          2. 注册给你的 agent（把 <dir> 换成这个目录的绝对路径）：
                 claude mcp add trestle -s user -e TRESTLE_AGENT=claude-code -- <dir>/trestle-mcp
                 codex  mcp add trestle    --env TRESTLE_AGENT=codex        -- <dir>/trestle-mcp

          3. Claude Code 还可以装上 skill（可选，讲怎么用好这些工具）：
                 cp -r skills/trestle ~/.claude/skills/trestle

          4. 自己看一眼：
                 ./trestle targets
                 ./trestle doctor

          注意：这三个二进制**必须待在同一个目录**——trestle-mcp 要在自己旁边
          找到 trestled 才能把 daemon 拉起来，配置与插件默认也在这里找。

          第一次调用会慢一点：daemon 要把全部插件编译一遍并缓存下来。
          EOF

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$out.zip" "$out" >/dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi
          ls -la trestle-*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            trestle-*.zip
            trestle-*.tar.gz
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 看一眼收到了什么
        run: ls -la artifacts

      # 用 runner 自带的 gh，不引第三方 action —— action 是在 "Set up job"
      # 阶段下载的，GitHub 一抖就把整个 job 带走。gh 已经装在镜像里了。
      - name: 建 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          每个包都是**自包含**的：三个二进制、全部插件、样例配置、WIT。
          解压之后照着 `GETTING-STARTED.txt` 走。

          Windows 上也可以直接跑 `install.ps1 -Register`，Linux / macOS 跑
          `install.sh --register`：装好目录、放进 PATH、注册给 Claude Code 与 Codex。

          > Windows 与 Linux 都跑过完整的离线测试套件；连真实服务器的那部分
          > 只在 Windows 上验证过。macOS 的包由 CI 构建并跑离线测试，没有手工验证。
          NOTES
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
