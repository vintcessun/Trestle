[package]
name = "trestle-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trestle"
path = "src/main.rs"

[dependencies]
trestle-core = { path = "../trestle-core" }
trestle-daemon = { path = "../trestle-daemon" }

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
